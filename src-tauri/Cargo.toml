[package]
name = "n300-desktop"
version = "0.1.0"
description = "Edifier N300 desktop control (unofficial)"
edition = "2021"

[lib]
name = "n300_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
