[package]
name = "deskhub-desktop"
version = "0.6.4"
description = "DeskHub personal device control"
edition = "2021"
rust-version = "1.99"

[[bin]]
name = "DeskHub"
path = "src/main.rs"

[lib]
name = "deskhub_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deskhub-backend = { path = "../../../backend" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
debug = 0

[workspace]
resolver = "2"
