[package]
name = "deskhub-backend"
version = "0.4.0"
edition = "2021"
rust-version = "1.99"

[lib]
name = "deskhub_backend"

[[bin]]
name = "deskhub"
path = "src/main.rs"

[features]
test-support = []

[[bin]]
name = "deskhub-test-module"
path = "src/bin/test-module.rs"
required-features = ["test-support"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
semver = "=1.0.28"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
